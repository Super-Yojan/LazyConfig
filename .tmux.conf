# Dr. Moscovium Tmux Configuration
# Minimal bottom status bar, adapts to the macOS light/dark appearance
# Author: Yojan Gautam (Dr. Moscovium)

# --- CORE SETTINGS ---
set -g status on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mode-keys vi
set -g status-keys vi
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g history-limit 3000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g bell-action none
set -g status-interval 5
set -gq allow-passthrough on
set -g visual-activity off

# --- COLOR STRATEGY (follows macOS light/dark automatically) ---
# iTerm2 has "Use Separate Colors for Light and Dark Mode" enabled, so it swaps
# its fg/bg with the system appearance (#101010 on #fafafa in light,
# #dcdcdc on #15191f in dark). Using `default` instead of hex lets the bar
# inherit that swap for free. colour8 (#686868) is the one fixed shade that
# stays readable on both backgrounds.
DIM="colour8"          # secondary text  (#686868)
ALERT="colour1"        # prefix / bell   (#b43c2a)

# --- STATUS BAR ---
set -g status-position bottom
set -g status-justify left
# bg=default + fg=default: the bar is transparent and its text tracks the
# terminal foreground, so it stays legible in both appearances.
set -g status-style "bg=default,fg=default"

# 1. Windows — dim when inactive, terminal-foreground when current.
set -g window-status-separator "  "
set -g window-status-style "bg=default,fg=$DIM"
set -g window-status-format "#I #W"
set -g window-status-current-style "bg=default,fg=default,bold"
set -g window-status-current-format "#I #W"
set -g window-status-activity-style "bg=default,fg=$ALERT"
set -g window-status-bell-style "bg=default,fg=$ALERT"

# 2. Left — session name
set -g status-left-length 100
set -g status-left " #[fg=default,bold]#S#[default]   "

# 3. Right — prefix indicator, battery, clock
set -g status-right-length 100
set -g status-right "#{prefix_highlight}#[fg=$DIM]#{battery_percentage}   #[fg=default]%H:%M "

# --- PANE BORDERS ---
set -g pane-border-style "fg=$DIM"
set -g pane-active-border-style "fg=default"

# --- MESSAGE & COMMAND LINE ---
set -g message-style "bg=default,fg=default,bold"
set -g message-command-style "bg=default,fg=$DIM"

# --- COPY MODE (matches iTerm2's own selection colour) ---
set -g mode-style "bg=#b3d7ff,fg=#000000"

# --- CLOCK MODE ---
set -g clock-mode-colour "$DIM"
set -g clock-mode-style 24

# --- PANE DISPLAY ---
set -g display-panes-active-colour "$ALERT"
set -g display-panes-colour "$DIM"

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Prefix indicator: a single dot instead of a coloured block
set -g @prefix_highlight_fg "$ALERT"
set -g @prefix_highlight_bg "default"
set -g @prefix_highlight_prefix_prompt '●'
set -g @prefix_highlight_output_prefix ''
set -g @prefix_highlight_output_suffix '  '
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_prompt '●'
set -g @prefix_highlight_copy_mode_attr "fg=$DIM,bg=default"

# --- BINDINGS ---
bind-key c run-shell 'MyCWD="#{pane_current_path}"; tmux new-window -c "$MyCWD"'
bind -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# --- INITIALIZE TPM ---
run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# Colour reference
# ============================================================
# Everything is `default` (inherits iTerm2's fg/bg, which swaps with the
# macOS appearance) except two fixed shades that read on both backgrounds:
#   DIM   colour8 = #686868   secondary text, inactive windows, borders
#   ALERT colour1 = #b43c2a   prefix indicator, bell, activity
# Light mode: #101010 on #fafafa   Dark mode: #dcdcdc on #15191f
# ============================================================
